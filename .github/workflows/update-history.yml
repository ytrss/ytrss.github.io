name: Update RSS feed history
on:
  workflow_dispatch:
jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: pip install -r worker/requirements.txt
      - name: Run the main script
        run: python worker/main.py
      - name: Commit the update
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add static/history.json
          git commit -m "GitHub Actions updated history.json"
          git push
